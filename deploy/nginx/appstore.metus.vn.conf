# Vhost cho shop chứng chỉ (FE Next.js, cổng 3002). Đặt ở /etc/nginx/sites-available/metus-cert-shop
# rồi bật HTTPS bằng: certbot --nginx -d appstore.metus.vn --redirect
server {
    listen 80;
    server_name appstore.metus.vn;

    # metus.vn nằm sau Cloudflare: lấy IP thật của khách để giới hạn tốc độ đăng nhập theo từng người,
    # không bị tính chung theo IP của Cloudflare.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Hồ sơ UDID iPhone gửi về chỉ vài KB
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # FE chưa chạy hoặc đang khởi động lại: báo bảo trì thay vì lỗi 502 khó hiểu
        error_page 502 503 504 = @updating;
    }

    location @updating {
        default_type text/html;
        add_header Retry-After 30 always;
        return 503 "<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Đang cập nhật</title><body style='font-family:sans-serif;text-align:center;padding:4rem 1rem'><h1>Đang cập nhật</h1><p>Hệ thống sẽ hoạt động trở lại trong ít phút.</p></body>";
    }
}
